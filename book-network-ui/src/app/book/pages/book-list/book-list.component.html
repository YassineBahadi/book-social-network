<h3>
    Books List
</h3>
@if(message){
    <div class="alert"  [class.alert-danger]="level==='error'" [class.alert-success]="level === 'success'">
        {{message}}
</div>
}
<hr>
<div class="d-flex justify-content-start gap-2 flex-wrap">
    @for(book of bookResponse.content ; track book.id) {
        <app-book-card [book]="book" (borrow)="borrowBook($event)" ></app-book-card>
    }
</div>

<div class="d-flex justify-content-center mt-3">
    <nav aria-label="Page navigation example">
        <ul class="pagination">
            <li class="page-item"><a (click)="goToFirstPage()" href="javascript:void(0)" class="page-link" aria-label="First" [class.disabled]="page==0"  >  <i class="fa-solid fa-angles-left"></i> </a></li>
            <li class="page-item"><a (click)="goToPreviousPage()" href="javascript:void(0)" class="page-link" aria-label="Previous" [class.disabled]="page==0" >  <i class="fa-solid fa-angle-left"></i> </a></li>
            @for(page of [].constructor(this.bookResponse.totalPages) ; track $index ){
            <li class="page-item"><a (click)="goToPage($index)" href="javascript:void(0)" class="page-link" aria-label="Previous" [class.active]="page==$index">  {{$index + 1}} </a></li>

            }
            <li class="page-item"><a (click)="goToNextPage()" href="javascript:void(0)" class="page-link" aria-label="Next" [class.disabled]="isLastPage" >  <i class="fa-solid fa-chevron-right"></i> </a></li>
            <li class="page-item"><a (click)="goToLastPage()" href="javascript:void(0)" class="page-link" aria-label="Last" [class.disabled]="isLastPage" >  <i class="fa-solid fa-angles-right"></i> </a></li>
        </ul>
    </nav>
</div>
