<div class="p-2">

    <h2>Manage my book</h2>
    <hr>
    @if(errorMsg.length){
        <div class="alert alert-danger mt-2" role="alert">
            @for(msg of errorMsg ; track msg){ 
                <p class="p-0 m-0">
                    {{msg}}
                </p>
            }
        </div>
    }
    <div class="d-flex gap-2">
        <div class="col-3">
            <img [src]=" selectedPicture || 'https://picsum.photos/200/300' " alt="..." class="rounded-1" width="100%" height="100%">
            <div class="mt-2">
                <input type="file" class="form-control" id="formFile" accept="image/*" (change)="onFileSelected($event)" >
            </div>
        </div>
        <div class="col-9">
            <form action="" class="row g-3">
                <div class="col-12">
                    <label for="title" class="form-label">Title</label>
                    <input [(ngModel)]="bookRequest.title" name="title" type="text" class="form-control" id="title" placeholder="Book title">
                </div>
                <div class="col-6">
                    <label for="author" class="form-label">Author name</label>
                    <input [(ngModel)]="bookRequest.authorName" name="author" type="text" class="form-control" id="author" placeholder="Author name">
                </div>
                <div class="col-6">
                    <label for="isbn" class="form-label">ISBN</label>
                    <input [(ngModel)]="bookRequest.isbn" name="isbn" type="text" class="form-control" id="isbn" placeholder="ISBN">
                </div>
                <div class="col-12">
                    <label for="synopsis" class="form-label">Synopsis</label>
                    <textarea rows="4" [(ngModel)]="bookRequest.synopsis" name="synopsis" class="form-control" id="synopsis" placeholder="Book synopsis"></textarea>
                </div>
                <div class="col-12">
                    <input  [(ngModel)]="bookRequest.shareable" name="shareable" id="shareme" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="shareme">
                        Share me
                    </label>
                </div>
                <div class="d-flex justify-content-end gap-2 col-12">
                    <button (click)="saveBook()" type="submit" class="btn btn-outline-primary">
                        <i class="fas fa-save"></i>&nbsp;Save
                    </button>
                    <a routerLink="/books/my-books" class="btn btn-link text-danger">
                        <i class="fas fa-times"></i>&nbsp; Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
