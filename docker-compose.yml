services:
  mysql:
    container_name: mysql-bsn
    image: mysql:8.0   # for MySQL 8.0
    environment:
      MYSQL_ROOT_PASSWORD: password   # required (set your root password)
      MYSQL_DATABASE: book_social_network                # optional (DB created at startup)
      MYSQL_USER: username                  # optional (custom user)
      MYSQL_PASSWORD: password
    ports:
        - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql   
    networks:
      - spring-demo
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev-bsn
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

  volumes:
      mysql_data: 
  networks:
      spring-demo:
        driver:bridge